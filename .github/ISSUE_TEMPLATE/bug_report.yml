name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead? A screenshot helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rollwise version
      description: Shown in the AddOns list, or in Rollwise.toc
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Dungeon or raid, party or raid group, and which look (Rollwise, Tooltip, Classic)
      placeholder: "Scarlet Monastery, 5-man, Rollwise look"
  - type: textarea
    id: diag
    attributes:
      label: Output of /rollwise diag
      description: Type /rollwise diag in game and paste what it prints in chat
      render: text
  - type: textarea
    id: errors
    attributes:
      label: Lua errors
      description: If a red error box appeared, paste its text here
      render: text
